[project]
name = "khestra-evidence"
version = "0.1.0"
description = "Framework-agnostic evidence collector layer for Khestra GRC apps"
license = { text = "Proprietary" }
requires-python = ">=3.12"
dependencies = [
    "pandas>=1.3.0",
    "boto3>=1.35.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["collectors", "collectors.*", "kevidence", "kevidence.*"]

[tool.setuptools]
py-modules = ["capability_taxonomy", "evidence_store", "filestore"]
