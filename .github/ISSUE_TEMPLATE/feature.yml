name: Feature request
description: Suggest an improvement to the free tier
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Note: automated evidence collectors and hosted operations are the paid
        edition and are out of scope for this repository.
