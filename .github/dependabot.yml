version: 2
updates:
  # One grouped PR per app for minor/patch bumps; majors open individually.
  - package-ecosystem: pip
    directory: /apps/cmmc
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /apps/soc2
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /apps/iso27001
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /apps/aigovernance
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /apps/core
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
